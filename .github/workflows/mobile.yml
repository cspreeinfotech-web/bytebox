name: mobile

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  DIRECT_PACKAGE: com.bytebox.app
  PLAY_PACKAGE: com.bytebox.play
  # SHA-256 of the permanent release certificate (public value, see docs/setup.md)
  RELEASE_CERT_SHA256: 8c8cf97a74c01f7dd03c46042880d1b977f8a1d7b7e19333b58aef61dcbf090d
  ADS_REFERRER: "utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: mobile/android/**/*.gradle*

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}

      - name: Generate launcher icons + splash (all flavors)
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Theme check — colours only in lib/theme.dart
        run: |
          if grep -rnE "Color\(0x|(^|[^A-Za-z])Colors\.[a-z]" lib --include=*.dart | grep -v "^lib/theme.dart"; then
            echo "::error::Hard-coded colours found outside lib/theme.dart"; exit 1
          fi

      - name: UPI manifest check (source)
        run: |
          m=android/app/src/main/AndroidManifest.xml
          for p in com.google.android.apps.nbu.paisa.user com.phonepe.app net.one97.paytm in.org.npci.upiapp \
                   in.amazon.mShop.android.shopping com.dreamplug.androidapp com.mobikwik_new \
                   com.csam.icici.bank.imobile com.bandhan.mbanking; do
            grep -q "android:name=\"$p\"" $m || { echo "::error::missing <queries> package $p"; exit 1; }
          done
          grep -q 'android:scheme="upi"' $m || { echo "::error::missing upi scheme query"; exit 1; }
          grep -q 'android:scheme="mailto"' $m || { echo "::error::missing mailto query"; exit 1; }

      - name: Analyze
        run: flutter analyze --no-fatal-infos 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}

      - name: Test
        run: flutter test --exclude-tags screenshots 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building with the debug key"; exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          sed -i 's/^ *//' android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build APKs (direct flavor) + AAB (play flavor)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          set -e
          # versionCode must grow with every upload to Play: use the workflow run number.
          common=(--release --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_KEY")
          if [ -n "${{ vars.WEBSITE_URL }}" ]; then common+=(--dart-define=WEBSITE_URL="${{ vars.WEBSITE_URL }}"); fi
          flutter build apk --flavor direct --target-platform android-arm,android-arm64 "${common[@]}" --dart-define=ANDROID_APP_ID=$DIRECT_PACKAGE
          cp build/app/outputs/flutter-apk/app-direct-release.apk "$RUNNER_TEMP/Bytebox.apk"
          flutter build apk --flavor direct --target-platform android-arm,android-arm64 "${common[@]}" --dart-define=ANDROID_APP_ID=$DIRECT_PACKAGE \
            --dart-define=APK_REFERRER="$ADS_REFERRER"
          cp build/app/outputs/flutter-apk/app-direct-release.apk "$RUNNER_TEMP/Bytebox-ads.apk"
          flutter build appbundle --flavor play "${common[@]}" --dart-define=PLAY_STORE=true \
            --dart-define=ANDROID_APP_ID=$PLAY_PACKAGE
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/Bytebox-play.aab"
          mkdir -p dist && cp "$RUNNER_TEMP"/Bytebox* dist/ && ls -la dist

      - name: Verify package names, callback schemes, UPI queries, signing
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in dist/Bytebox.apk dist/Bytebox-ads.apk; do
            "$BT/aapt2" dump badging "$apk" | grep -q "package: name='$DIRECT_PACKAGE'" \
              || { echo "::error::$apk package is not $DIRECT_PACKAGE"; exit 1; }
            xml=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            echo "$xml" | grep -q "\"$DIRECT_PACKAGE\" (Raw: \"$DIRECT_PACKAGE\")" || true
            echo "$xml" | grep -A1 'A: http://schemas.android.com/apk/res/android:scheme' | grep -q "$DIRECT_PACKAGE" \
              || { echo "::error::$apk missing $DIRECT_PACKAGE://login-callback"; exit 1; }
            echo "$xml" | grep -q 'com.bandhan.mbanking' || { echo "::error::$apk missing UPI <queries>"; exit 1; }
            if [ "$SIGNED" = "1" ]; then
              d=$("$BT/apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
              [ "$d" = "$RELEASE_CERT_SHA256" ] || { echo "::error::$apk not signed with the release key ($d)"; exit 1; }
            fi
          done
          # Play: target API 36 + 16 KB page-size alignment of native libraries
          for apk in dist/Bytebox.apk; do
            t=$("$BT/aapt2" dump badging "$apk" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p")
            echo "targetSdkVersion=$t"
            [ "${t:-0}" -ge 36 ] || { echo "::error::targetSdkVersion $t < 36 (Google Play requirement)"; exit 1; }
            "$BT/zipalign" -c -P 16 -v 4 "$apk" > "$RUNNER_TEMP/zipalign.txt" \
              || { tail -20 "$RUNNER_TEMP/zipalign.txt"; echo "::error::$apk is not 16 KB aligned"; exit 1; }
            tmp=$(mktemp -d); unzip -q -o "$apk" 'lib/arm64-v8a/*.so' -d "$tmp"
            for so in "$tmp"/lib/arm64-v8a/*.so; do
              objdump -p "$so" | awk '/LOAD/ {print $NF}' | grep -qv '2\*\*1[4-9]' \
                && { echo "::error::$(basename $so) has LOAD segments aligned below 16 KB"; exit 1; }
            done
            echo "16 KB alignment OK"
          done
          # AAB: protobuf manifest — check strings
          unzip -p dist/Bytebox-play.aab base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/play-manifest.pb"
          grep -aq "$PLAY_PACKAGE" "$RUNNER_TEMP/play-manifest.pb" || { echo "::error::AAB package is not $PLAY_PACKAGE"; exit 1; }
          grep -aq "com.bandhan.mbanking" "$RUNNER_TEMP/play-manifest.pb" || { echo "::error::AAB missing UPI <queries>"; exit 1; }
          if grep -aq "com.google.android.gms.permission.AD_ID" "$RUNNER_TEMP/play-manifest.pb"; then
            echo "::error::AAB must not request AD_ID"; exit 1
          fi
          echo "All artifact checks passed."

      - name: Publish APKs to the website (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -e
          key=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; k=[x for x in json.load(sys.stdin) if x.get('name')=='service_role' or x.get('type')=='secret']; print(k[0]['api_key'])")
          echo "::add-mask::$key"
          v="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)-${{ github.run_number }}"
          stamp=$(date -u +%Y%m%d%H%M)
          up() { curl -sS -f -X POST "$URL/storage/v1/object/downloads/$2" -H "apikey: $key" -H "Authorization: Bearer $key" \
                   -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary "@$1" >/dev/null; }
          up dist/Bytebox.apk "organic/Bytebox-$v-$stamp.apk"
          up dist/Bytebox-ads.apk "ads/Bytebox-ads-$v-$stamp.apk"
          curl -sS -f -X PATCH "$URL/rest/v1/site_settings?id=eq.1" -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" \
            -d "{\"organic_apk_path\": \"organic/Bytebox-$v-$stamp.apk\", \"organic_apk_version\": \"$v\", \"ads_apk_path\": \"ads/Bytebox-ads-$v-$stamp.apk\", \"ads_apk_version\": \"$v\", \"ads_apk_uploaded_at\": \"$(date -u +%FT%TZ)\"}"
          echo "Published Bytebox $v to the website (/ and /d)."

      - name: Report failure log as annotation
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/ci.log" ] || exit 0
          msg=$(grep -vE '^\s*$|Download|Downloading|Resolving dependencies' "$RUNNER_TEMP/ci.log" | grep -iE -B2 -A6 'error|exception|failed|what went wrong|e: ' | tail -n 120 || true)
          [ -z "$msg" ] && msg=$(tail -n 80 "$RUNNER_TEMP/ci.log" || true)
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
          echo "::error title=CI log tail::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: Bytebox-apks
          path: mobile/dist/*
          retention-days: 30

  screenshots:
    # Renders the Plans screen states with the real widgets and commits the PNGs to the PR branch.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Render
        working-directory: mobile
        run: |
          flutter pub get
          flutter test --tags screenshots --update-goldens
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live-controls
          git diff --cached --quiet || (git commit -m "Screenshots: Plans screen states" && git push)
