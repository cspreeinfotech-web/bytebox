name: scaffold-mobile
# One-time helper: generates the Flutter/Android boilerplate (gradle wrapper etc.)
# with the official `flutter create` and commits it back to this branch.
on:
  push:
    branches: [scaffold-mobile]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - name: flutter create
        run: |
          if [ ! -f mobile/android/gradlew ]; then
            flutter create --org com.bytebox --project-name bytebox --platforms android --android-language kotlin mobile
            cd mobile && flutter pub add supabase_flutter shared_preferences uuid package_info_plus device_info_plus url_launcher video_player file_picker path_provider share_plus google_fonts flutter_launcher_icons flutter_native_splash mime intl open_filex video_thumbnail image_picker --dry-run >/dev/null 2>&1 || true
            flutter --version --machine > ../flutter-version.json
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Scaffold Flutter project with flutter create"
          git push
