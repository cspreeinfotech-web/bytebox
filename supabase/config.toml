# Supabase CLI config. Used by CI (`supabase db start` for tests, `supabase link` + `db push` for deploy).
# Remote-only settings (anonymous sign-ins, redirect URLs) are ALSO listed in docs/setup.md
# because `db push` does not change Auth settings on the hosted project.
project_id = "bytebox"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://bytebox.vercel.app"
additional_redirect_urls = ["com.bytebox.app://login-callback", "com.bytebox.play://login-callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false
